# The tokio server `blame slow` is checked against (see src/main.rs). Not part
# of the workspace: it is built by tests/scenarios/rt_acceptance.sh.
[package]
name = "tokio_truth"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
tokio = { version = "1.49", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "signal"] }
# HTTPS through rustls, for `blame slow --tls` (built with --features tls).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }

[features]
tls = ["dep:tokio-rustls", "dep:rustls-pki-types"]

[profile.release]
# The adapter finds tokio's thread-local through the symbol table.
strip = false

[workspace]
