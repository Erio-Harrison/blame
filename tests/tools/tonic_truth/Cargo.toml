[package]
name = "tonic_truth"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# tls-ring: over rustls when TLS_CERT and TLS_KEY are set (see src/main.rs).
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1.49", features = ["rt-multi-thread", "net", "time", "signal", "macros"] }

[profile.release]
# The agent finds tokio's functions by their symbols.
strip = false

[workspace]
